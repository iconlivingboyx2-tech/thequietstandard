<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Quiet Standard</title>

<meta name="description" content="An evolving design house devoted to architecture, philosophy and disciplined living.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* ===================================================
   THE QUIET STANDARD
   VERSION II
=================================================== */

:root{

    --bg:#000000;

    --surface:#050505;

    --text:#f5f5f0;

    --body:rgba(245,245,240,.70);

    --muted:#6c6c6c;

    --line:#222;

    --section:260px;

    --reading:480px;

    --content:1320px;

    --transition:.45s cubic-bezier(.2,.8,.2,1);

}

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

html{

    scroll-behavior:smooth;

}

body{

    background:var(--bg);

    color:var(--text);

    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;

    overflow-x:hidden;

    -webkit-font-smoothing:antialiased;

    text-rendering:optimizeLegibility;

}

img{

    display:block;

    width:100%;

    height:auto;

}

a{

    color:inherit;

    text-decoration:none;

}

button{

    background:none;

    border:none;

    cursor:pointer;

    color:inherit;

}

section{

    position:relative;

    width:100%;

    padding:var(--section) 12vw;

}

.container{

    width:100%;

    max-width:var(--content);

    margin:auto;

}

.section-label{

    font-size:12px;

    letter-spacing:.50em;

    text-transform:uppercase;

    color:var(--muted);

    margin-bottom:110px;

}

.display{

    font-family:"Cormorant Garamond",serif;

    font-weight:400;

    font-size:clamp(68px,8vw,104px);

    line-height:.92;

    letter-spacing:-.03em;

}

.sub-display{

    font-family:"Cormorant Garamond",serif;

    font-weight:400;

    font-size:clamp(28px,3vw,40px);

    line-height:1.25;

    margin-top:90px;

    color:rgba(245,245,240,.92);

}

.body-copy{

    margin-top:140px;

    max-width:var(--reading);

    font-size:18px;

    line-height:2.1;

    font-weight:300;

    color:var(--body);

}

.divider{

    width:100%;

    height:1px;

    background:var(--line);

}

::selection{

    background:#ffffff;

    color:#000;

}

@media (max-width:900px){

section{

    padding:180px 9vw;

}

.display{

    font-size:54px;

}

.sub-display{

    font-size:28px;

}

.body-copy{

    font-size:17px;

}

}
